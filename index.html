<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MoneyMoney</title>
<meta name="description" content="Учёт личных и бизнес-денег">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MoneyMoney">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-space="personal">
<div id="login" class="login" hidden>
  <form class="box" id="login-form" autocomplete="on">
    <img src="icons/icon-192.png" alt="">
    <h1>Money<i>Money</i></h1>
    <p id="login-sub">Войдите, чтобы записи были одинаковыми на iPhone и Mac.</p>
    <input class="inp" id="l-email" type="email" autocomplete="username" placeholder="Почта" required>
    <input class="inp" id="l-pass" type="password" autocomplete="current-password" placeholder="Пароль (не короче 6 символов)" minlength="6" required>
    <div class="err" id="l-err"></div>
    <button class="btn" id="l-go" type="submit">Войти</button>
    <button class="linkbtn" id="l-mode" type="button">Первый раз? Создать аккаунт</button>
  </form>
</div>

<div id="main" hidden>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand">Money<i>Money</i></div>
    <div class="top-r">
      <div class="sync" id="sync" title=""><i></i><span id="sync-t"></span></div>
      <div class="seg space" role="group" aria-label="Раздел">
        <button id="sp-personal" data-space="personal" aria-pressed="true">Личное</button>
        <button id="sp-business" data-space="business" aria-pressed="false">Бизнес</button>
      </div>
    </div>
  </div>
  <div class="month">
    <button class="iconbtn" id="m-prev" aria-label="Предыдущий месяц">‹</button>
    <h2 id="m-title">…</h2>
    <button class="iconbtn" id="m-next" aria-label="Следующий месяц">›</button>
  </div>
  <div id="view"></div>
</div>

<button class="fab" id="fab" aria-label="Добавить операцию"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav"><div class="in">
  <button data-tab="ops" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Операции</button>
  <button data-tab="rep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Отчёты</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Настройки</button>
</div></nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Операция"><div class="in" id="sheet-in"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
